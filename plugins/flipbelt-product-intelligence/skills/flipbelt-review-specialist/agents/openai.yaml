interface:
  display_name: "FlipBelt 审核专员"
  short_description: "按当前知识 release 审查详情页、线框图和尺码表"
  default_prompt: "Use $flipbelt-review-specialist to review this FlipBelt wireframe, detail-page content, or size chart and produce a sourced non-final report."
dependencies:
  tools:
    - type: "mcp"
      value: "flipbelt-kb"
      description: "FlipBelt 统一 OAuth 只读知识库 MCP Server"
      transport: "streamable_http"
      url: "https://wiki.flipbeltchina.com/mcp"
policy:
  allow_implicit_invocation: false
